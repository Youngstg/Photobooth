name: CI Automated Tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  smoke-and-lint:
    name: Lint, Syntax & Playwright Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify Python Server Syntax
        run: python -m py_compile server.py

      - name: Run Playwright CI Smoke Suite
        run: npm test
